<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" width="1100" height="770" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#37474f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8e8e8e"/></marker>
  </defs>
  <rect width="1100" height="770" fill="#ffffff"/>
  <text x="550" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#232f3e">Multi-Tier AWS VPC Architecture (eu-north-1)</text>

  <!-- Top row: user + planned services -->
  <rect x="40" y="48" width="120" height="44" rx="8" fill="#eceff1" stroke="#37474f"/>
  <text x="100" y="75" text-anchor="middle" font-size="14">User / Internet</text>
  <rect x="260" y="48" width="170" height="44" rx="8" fill="#fff" stroke="#8e8e8e" stroke-dasharray="6 4"/>
  <text x="345" y="68" text-anchor="middle" font-size="14" fill="#666">Route 53 (DNS)</text>
  <text x="345" y="84" text-anchor="middle" font-size="11" fill="#888">Planned</text>
  <rect x="500" y="48" width="170" height="44" rx="8" fill="#fff" stroke="#8e8e8e" stroke-dasharray="6 4"/>
  <text x="585" y="68" text-anchor="middle" font-size="14" fill="#666">CloudFront (CDN)</text>
  <text x="585" y="84" text-anchor="middle" font-size="11" fill="#888">Planned</text>
  <line x1="160" y1="70" x2="258" y2="70" stroke="#8e8e8e" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <line x1="430" y1="70" x2="498" y2="70" stroke="#8e8e8e" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <path d="M585 92 L585 119 L638 119" stroke="#8e8e8e" stroke-dasharray="6 4" fill="none" marker-end="url(#g)"/>

  <!-- PUBLIC VPC -->
  <rect x="30" y="140" width="1040" height="235" rx="10" fill="#f1f8e9" stroke="#558b2f" stroke-width="2"/>
  <text x="48" y="162" font-size="15" font-weight="bold" fill="#33691e">PUBLIC-VPC (10.0.x.x)</text>
  <path d="M100 92 L100 119 L638 119" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="640" y="104" width="130" height="30" rx="6" fill="#fff" stroke="#37474f"/>
  <text x="705" y="124" text-anchor="middle" font-size="13">Internet Gateway</text>
  <path d="M705 134 L705 155 L560 155 L560 168" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="440" y="170" width="200" height="46" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="540" y="190" text-anchor="middle" font-size="14" font-weight="bold">Application Load Balancer</text>
  <text x="540" y="207" text-anchor="middle" font-size="11" fill="#555">Internet-facing, 2 AZs, Target Group</text>

  <rect x="90" y="250" width="360" height="110" rx="8" fill="#fff" stroke="#558b2f" stroke-dasharray="5 3"/>
  <text x="102" y="268" font-size="12" fill="#33691e">Public Subnet 1 (eu-north-1a) | NACL + SG</text>
  <rect x="150" y="285" width="240" height="56" rx="8" fill="#ffe0b2" stroke="#e65100"/>
  <text x="270" y="310" text-anchor="middle" font-size="14" font-weight="bold">EC2: PUBLIC-01</text>
  <text x="270" y="328" text-anchor="middle" font-size="11" fill="#555">Web tier (application)</text>

  <rect x="640" y="250" width="360" height="110" rx="8" fill="#fff" stroke="#558b2f" stroke-dasharray="5 3"/>
  <text x="652" y="268" font-size="12" fill="#33691e">Public Subnet 2 (eu-north-1b) | NACL + SG</text>
  <rect x="700" y="285" width="240" height="56" rx="8" fill="#ffe0b2" stroke="#e65100"/>
  <text x="820" y="310" text-anchor="middle" font-size="14" font-weight="bold">EC2: PUBLIC-02</text>
  <text x="820" y="328" text-anchor="middle" font-size="11" fill="#555">Web tier (application)</text>

  <path d="M480 216 L480 233 L270 233 L270 283" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M600 216 L600 233 L820 233 L820 283" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Peering -->
  <path d="M270 341 L270 400" stroke="#6a1b9a" stroke-width="2" fill="none"/>
  <path d="M820 341 L820 392 L270 392" stroke="#6a1b9a" stroke-width="2" fill="none"/>
  <path d="M270 400 L270 488" stroke="#6a1b9a" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="300" y="396" width="150" height="26" rx="13" fill="#f3e5f5" stroke="#6a1b9a"/>
  <text x="375" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a148c">VPC Peering</text>

  <!-- PRIVATE VPC -->
  <rect x="30" y="435" width="1040" height="315" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="48" y="456" font-size="15" font-weight="bold" fill="#0d47a1">PRIVATE-VPC (11.0.x.x)</text>

  <rect x="60" y="490" width="420" height="110" rx="8" fill="#fff" stroke="#1565c0" stroke-dasharray="5 3"/>
  <text x="72" y="508" font-size="12" fill="#0d47a1">Private Subnet (eu-north-1a)</text>
  <rect x="120" y="525" width="200" height="56" rx="8" fill="#bbdefb" stroke="#1565c0"/>
  <text x="220" y="550" text-anchor="middle" font-size="14" font-weight="bold">EC2: PRIVATE-EC2</text>
  <text x="220" y="568" text-anchor="middle" font-size="11" fill="#555">App tier, no public IP</text>

  <rect x="520" y="490" width="250" height="110" rx="8" fill="#fff" stroke="#1565c0" stroke-dasharray="5 3"/>
  <text x="532" y="508" font-size="12" fill="#0d47a1">2 Private DB Subnets (2 AZs)</text>
  <rect x="560" y="525" width="170" height="56" rx="8" fill="#c5cae9" stroke="#283593"/>
  <text x="645" y="550" text-anchor="middle" font-size="14" font-weight="bold">RDS: database-1</text>
  <text x="645" y="568" text-anchor="middle" font-size="11" fill="#555">MySQL, private</text>

  <rect x="810" y="490" width="230" height="110" rx="8" fill="#fff" stroke="#1565c0" stroke-dasharray="5 3"/>
  <text x="822" y="508" font-size="12" fill="#0d47a1">Public Subnet (NAT)</text>
  <rect x="850" y="525" width="150" height="56" rx="8" fill="#b2dfdb" stroke="#00695c"/>
  <text x="925" y="550" text-anchor="middle" font-size="14" font-weight="bold">NAT Gateway</text>
  <text x="925" y="568" text-anchor="middle" font-size="11" fill="#555">Outbound only</text>

  <line x1="320" y1="553" x2="558" y2="553" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <text x="440" y="545" text-anchor="middle" font-size="11" fill="#333">MySQL 3306</text>

  <path d="M220 581 L220 625 L880 625 L880 583" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="550" y="618" text-anchor="middle" font-size="11" fill="#333">Updates via NAT (outbound)</text>

  <path d="M960 581 L960 658" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="905" y="660" width="110" height="30" rx="6" fill="#fff" stroke="#37474f"/>
  <text x="960" y="680" text-anchor="middle" font-size="13">Internet Gateway</text>
  <path d="M960 690 L960 720" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="960" y="736" text-anchor="middle" font-size="12" fill="#333">Internet</text>

  <!-- Legend -->
  <line x1="60" y1="690" x2="100" y2="690" stroke="#37474f" stroke-width="2"/>
  <text x="108" y="694" font-size="12">Current traffic</text>
  <line x1="60" y1="712" x2="100" y2="712" stroke="#8e8e8e" stroke-dasharray="6 4"/>
  <text x="108" y="716" font-size="12">Planned (not configured)</text>
  <line x1="60" y1="734" x2="100" y2="734" stroke="#6a1b9a" stroke-width="2"/>
  <text x="108" y="738" font-size="12">VPC peering route</text>
</svg>
